<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1320" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="neonBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="circleArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0084ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="6" />

  <!-- Outer Cyber Track Arc -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="20" stroke-linecap="round" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#circleArc)" stroke-width="20" stroke-dasharray="848" stroke-dashoffset="280" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Ticks Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6" stroke-dasharray="6 20" />

  <!-- Central High-Velocity Bolt / Wings Symbol -->
  <path d="M 276 96 L 156 280 L 246 280 L 216 416 L 356 232 L 266 232 Z" fill="url(#neonBolt)" filter="url(#glow)" />
</svg>
